site_name: Infra Lab
site_url: https://kevzkip.github.io/infra-lab/
site_author: Kevin Kipkorir
site_description: >-
  Systems engineering notes — Linux, Go, containers, observability.

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: deep purple
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      archive: true
      categories: true
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags

nav:
  - Home: index.md
  - Environment Setup: 01-environment-setup.md
  - Documentation as Code: 02-documentation-as-code.md
  - Blog: blog/index.md

strict: true