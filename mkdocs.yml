site_name: Infra Lab
site_url: https://kevzkip.github.io/infra-lab/
site_author: Kevin Kipkorir
site_description: >-
  Systems engineering notes — Linux, Go, containers, observability.

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: deep purple
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Environment Setup: 01-environment-setup.md
  - Documentation as Code: 02-documentation-as-code.md

strict: true